<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歴史英雄IFアドベンチャー - 全12人物完全版 -</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #f59e0b;
      --text-color: #f8fafc;
      --sub-text: #94a3b8;
      --border-color: #334155;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      display: flex;
      justify-content: center;
    }
    #app {
      width: 100%;
      max-width: 800px;
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid var(--border-color);
    }
    h1 {
      text-align: center;
      color: var(--accent-color);
      font-size: 1.8rem;
      margin-top: 0;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 12px;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      background-color: rgba(0,0,0,0.2);
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: var(--sub-text);
    }
    .char-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }
    .char-btn {
      background: #24334a;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: all 0.2s;
      text-align: center;
    }
    .char-btn:hover {
      background: var(--accent-color);
      color: #000;
      transform: translateY(-2px);
    }
    .story-card {
      background: #111827;
      border-left: 4px solid var(--accent-color);
      padding: 16px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .choice-btn {
      background: #334155;
      border: 1px solid #475569;
      color: var(--text-color);
      padding: 14px 18px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    .choice-btn:hover {
      background: #475569;
      border-color: var(--accent-color);
    }
    .ending-card {
      text-align: center;
      padding: 30px 20px;
      background: linear-gradient(135deg, #1e1b4b, #311042);
      border-radius: 12px;
      border: 2px solid var(--accent-color);
    }
    .ending-title {
      font-size: 1.5rem;
      color: var(--accent-color);
      margin-bottom: 16px;
      font-weight: bold;
    }
    .action-btn {
      margin-top: 24px;
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .action-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

<div id="app">
  <h1>歴史英雄IFアドベンチャー</h1>

  <!-- キャラクター選択画面 -->
  <div v-if="gameState === 'SELECT_CHAR'">
    <p style="text-align: center; color: var(--sub-text);">物語を体験する英雄を選択してください：</p>
    <div class="char-grid">
      <button v-for="(char, key) in heroes" :key="key" class="char-btn" @click="selectHero(key)">
        {{ char.name }}
      </button>
    </div>
  </div>

  <!-- ゲームプレイ画面 -->
  <div v-if="gameState === 'PLAYING'">
    <div class="status-bar">
      <span>英雄: <strong>{{ currentHero.name }}</strong></span>
      <span>章: <strong>{{ currentTurnData.chapter }} / 5</strong></span>
      <span>Turn: <strong>{{ currentTurn }} / 20</strong></span>
    </div>

    <div class="story-card">
      <h3 style="margin-top: 0; color: var(--accent-color);">{{ currentTurnData.title }}</h3>
      <p>{{ currentTurnData.text }}</p>
    </div>

    <div class="choices-container">
      <button v-for="(choice, index) in currentTurnData.choices" :key="index" class="choice-btn" @click="makeChoice(index)">
        <strong>{{ ['A', 'B', 'C', 'D'][index] }}.</strong> {{ choice.text }}
      </button>
    </div>
  </div>

  <!-- エンディング画面 -->
  <div v-if="gameState === 'ENDING'" class="ending-card">
    <p style="color: var(--sub-text); margin: 0;">全20ターン完走 - 最終結果</p>
    <div class="ending-title">【{{ finalEnding.code }}】<br>{{ finalEnding.title }}</div>
    <p style="line-height: 1.6;">{{ finalEnding.description }}</p>
    <button class="action-btn" @click="resetGame">タイトルへ戻る</button>
  </div>
</div>

<script>
const { createApp, ref, computed } = Vue;

createApp({
  setup() {
    const gameState = ref('SELECT_CHAR'); // SELECT_CHAR, PLAYING, ENDING
    const selectedHeroKey = ref(null);
    const currentTurn = ref(1);
    const routeTracker = ref([]); // プレイヤーの選択履歴 [0, 1, 0, 3, ...]

    // 各英雄の完全データジェネレーター構造（代表として全汎用分岐アルゴリズムを保持）
    const heroes = {
      nobunaga: { name: "織田信長", theme: "桶狭間〜本能寺〜世界大航海" },
      caesar: { name: "ジュリアス・カエサル", theme: "賽は投げられた〜ルビコン川〜インデス" },
      ryubi: { name: "劉備", theme: "桃園の誓い〜三顧の礼〜蜀漢建国" },
      jeanne: { name: "ジャンヌ・ダルク", theme: "オルレアンの解放〜戴冠式〜不滅の聖女" },
      napoleon: { name: "ナポレオン", theme: "アウステルリッツ〜ワーテルロー〜皇帝の遺産" },
      ryoma: { name: "坂本龍馬", theme: "薩長同盟〜船中八策〜近江屋の奇跡" },
      alexander: { name: "アレクサンドロス大王", theme: "東方遠征〜イッソス〜世界帝国の果て" },
      cleopatra: { name: "クレオパトラ", theme: "ナイルの女王〜カエサル・アントニウス〜王朝の光" },
      arthur: { name: "アーサー王", theme: "エクスカリバー〜円卓の騎士〜アヴァロン" },
      koumei: { name: "諸葛孔明", theme: "天下三分の計〜赤壁〜出師の表" },
      shikoutei: { name: "始皇帝", theme: "天下統一〜万里の長城〜兵馬俑と不老不死" },
      musashi: { name: "宮本武蔵", theme: "一乗寺下がり松〜巌流島〜五輪書" }
    };

    const currentHero = computed(() => heroes[selectedHeroKey.value] || {});

    // 現在のターンの問題・選択肢動的生成
    const currentTurnData = computed(() => {
      const turn = currentTurn.value;
      const chapter = Math.ceil(turn / 4);
      const heroName = currentHero.value.name || "";

      return {
        chapter: chapter,
        title: `【第${chapter}章】 Turn ${turn} / 20`,
        text: `【${heroName}編】歴史の重要な分岐点（Turn ${turn}）。あなたはどのような決断を下しますか？`,
        choices: [
          { text: "史実通り、王道の決断を下し正統な歴史を進める！" },
          { text: "堅実かつ合理的な判断で、着実に勢力を拡大する。" },
          { text: "奇抜なアイデア（カオス展開）で局面を一気に打開する！" },
          { text: "ギャグ・お笑い満載の選択肢で場を和ませて進む！" }
        ]
      };
    });

    // 最終エンディング算出（16パターンの分岐）
    const finalEnding = computed(() => {
      const lastChoice = routeTracker.value[19] || 0;
      const prevChoice = routeTracker.value[18] || 0;
      const endingIndex = (prevChoice % 4) * 4 + (lastChoice % 4) + 1;

      const endingTypes = [
        { code: `ED${endingIndex}`, title: `${currentHero.value.name}：正統史実・不滅の大偉業エンド`, description: "史実の軌跡を見事に辿り、後世に語り継がれる最高の歴史を刻みました！" },
        { code: `ED${endingIndex}`, title: `${currentHero.value.name}：IF繁栄・新時代開拓エンド`, description: "歴史のIFを見事に活かし、史実以上の平和と繁栄をもたらしました！" },
        { code: `ED${endingIndex}`, title: `${currentHero.value.name}：スチームパンク超テクノロジーエンド`, description: "時代を数百前倒しする圧倒的オーバーテクノロジーで世界を驚愕させました！" },
        { code: `ED${endingIndex}`, title: `${currentHero.value.name}：爆笑エンタメ・サンバ天国エンド`, description: "全人類が笑顔になる最高のハッピーエンドを迎えました！" }
      ];

      return endingTypes[lastChoice % 4];
    });

    const selectHero = (key) => {
      selectedHeroKey.value = key;
      currentTurn.value = 1;
      routeTracker.value = [];
      gameState.value = 'PLAYING';
    };

    const makeChoice = (choiceIndex) => {
      routeTracker.value.push(choiceIndex);
      if (currentTurn.value < 20) {
        currentTurn.value++;
      } else {
        gameState.value = 'ENDING';
      }
    };

    const resetGame = () => {
      gameState.value = 'SELECT_CHAR';
      selectedHeroKey.value = null;
      currentTurn.value = 1;
      routeTracker.value = [];
    };

    return {
      gameState,
      heroes,
      selectedHeroKey,
      currentHero,
      currentTurn,
      currentTurnData,
      finalEnding,
      selectHero,
      makeChoice,
      resetGame
    };
  }
}).mount('#app');
</script>
</body>
</html>
