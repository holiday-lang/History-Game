<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歴史英雄マルチエンディング・ノベルゲーム</title>
  <style>
    :root {
      --bg-color: #1a1a2e;
      --card-bg: #16213e;
      --accent-color: #e94560;
      --text-color: #ffffff;
      --sub-text: #b2bec3;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #game-container {
      width: 100%;
      max-width: 800px;
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      padding: 30px;
      box-sizing: border-box;
    }

    .header {
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 15px;
      margin-bottom: 25px;
      text-align: center;
    }

    .title {
      font-size: 1.8rem;
      margin: 0 0 10px 0;
      color: var(--accent-color);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      color: var(--sub-text);
      font-size: 0.9rem;
    }

    .story-box {
      background-color: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 20px;
      font-size: 1.1rem;
      line-height: 1.6;
      min-height: 120px;
      margin-bottom: 25px;
    }

    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .choice-btn {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-color);
      padding: 15px 20px;
      border-radius: 6px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .choice-btn:hover {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .character-select {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .char-card {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .char-card:hover {
      border-color: var(--accent-color);
      background-color: rgba(233, 69, 96, 0.1);
    }

    .ending-card {
      text-align: center;
      padding: 20px;
      background-color: rgba(233, 69, 96, 0.15);
      border: 2px solid var(--accent-color);
      border-radius: 8px;
    }

    .reset-btn {
      margin-top: 20px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div class="header">
    <h1 class="title" id="game-title">歴史英雄ノベル</h1>
    <div class="status-bar" id="status-bar">
      <span id="char-name">人物を選択してください</span>
      <span id="turn-count">-- / --</span>
    </div>
  </div>

  <div id="game-body">
    <!-- 動的コンテンツ領域 -->
  </div>
</div>

<script>
  // 1. データ（game_data.json）を読み込む
fetch('game_data.json')
  .then(response => {
    if (!response.ok) {
      throw new Error('JSONファイルの読み込みに失敗しました');
    }
    return response.json();
  })
  .then(gameData => {
    console.log('データ読み込み成功:', gameData);
    
    // 2. データの読み込みが終わってからゲームを起動する処理
    // （※ここにAIが作ったゲームの初期化関数を書きます）
    initGame(gameData); 
  })
  .catch(error => console.error('エラー:', error));
  let gameData = null;
  let currentCharacter = null;
  let currentTurnIndex = 0;
  let choiceHistory = [];

  // JSONデータのロード
  async function loadGameData() {
    try {
      const response = await fetch('game_data.json');
      gameData = await response.json();
      document.getElementById('game-title').innerText = gameData.title;
      renderCharacterSelection();
    } catch (error) {
      console.error("データの読み込みに失敗しました:", error);
      document.getElementById('game-body').innerHTML = '<p>game_data.json の読み込みに失敗しました。</p>';
    }
  }

  // 人物選択画面のレンダリング
  function renderCharacterSelection() {
    const body = document.getElementById('game-body');
    document.getElementById('char-name').innerText = "人物を選択してください";
    document.getElementById('turn-count').innerText = "";

    let html = '<div class="character-select">';
    gameData.characters.forEach(char => {
      html += `
        <div class="char-card" onclick="selectCharacter('${char.id}')">
          <h3>${char.name}</h3>
          <p style="font-size: 0.8rem; color: var(--sub-text);">${char.theme}</p>
        </div>
      `;
    });
    html += '</div>';
    body.innerHTML = html;
  }

  // キャラクター決定・ゲーム開始
  function selectCharacter(charId) {
    currentCharacter = gameData.characters.find(c => c.id === charId);
    currentTurnIndex = 0;
    choiceHistory = [];
    renderTurn();
  }

  // ターン進行のレンダリング
  function renderTurn() {
    const turnData = currentCharacter.turns[currentTurnIndex];
    if (!turnData) {
      renderEnding();
      return;
    }

    document.getElementById('char-name').innerText = `${currentCharacter.name} 編`;
    document.getElementById('turn-count').innerText = `Turn ${turnData.turn} / 章: ${turnData.chapter}`;

    const body = document.getElementById('game-body');
    let html = `
      <div style="font-size:0.9rem; color:var(--accent-color); margin-bottom:5px;">${turnData.chapter_title || ''}</div>
      <div class="story-box">${turnData.text}</div>
      <div class="choices-container">
    `;

    turnData.choices.forEach(choice => {
      html += `
        <button class="choice-btn" onclick="makeChoice('${choice.branch}', ${choice.next_turn})">
          <strong>${choice.id}.</strong> ${choice.text}
        </button>
      `;
    });

    html += '</div>';
    body.innerHTML = html;
  }

  // 選択肢のクリックハンドラ
  function makeChoice(branch, nextTurn) {
    choiceHistory.push(branch);
    currentTurnIndex++;
    if (currentTurnIndex < currentCharacter.turns.length) {
      renderTurn();
    } else {
      renderEnding();
    }
  }

  // エンディング描画
  function renderEnding() {
    const body = document.getElementById('game-body');
    const key = choiceHistory.slice(0, 4).join('_'); // 章ごとの主要分岐から判定
    const ending = (currentCharacter.endings && currentCharacter.endings[key]) || {
      id: "ED_GENERIC",
      title: "歴史の彼方へエンド",
      description: "あなたの選択が紡いだ独自の歴史がここに完結した。"
    };

    document.getElementById('turn-count').innerText = "COMPLETE";

    body.innerHTML = `
      <div class="ending-card">
        <h2 style="color: var(--accent-color);">${ending.id}: ${ending.title}</h2>
        <p>${ending.description}</p>
        <button class="reset-btn" onclick="renderCharacterSelection()">人物選択に戻る</button>
      </div>
    `;
  }

  // 初期化実行
  window.onload = loadGameData;
</script>
</body>
</html>
