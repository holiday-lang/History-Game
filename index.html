<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>なりきり歴史シミュレーション：織田信長編</title>
  <style>
    :root {
      --primary-color: #8b0000;
      --bg-color: #1a1a1a;
      --card-bg: #2d2d2d;
      --text-color: #f0f0f0;
      --accent-color: #d4af37;
    }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    #game-container {
      background-color: var(--card-bg);
      border: 2px solid var(--accent-color);
      border-radius: 12px;
      max-width: 650px;
      width: 100%;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #444;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .turn-badge {
      background-color: var(--primary-color);
      color: #fff;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .question-text {
      font-size: 1.15rem;
      line-height: 1.6;
      margin-bottom: 25px;
      white-space: pre-wrap;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background-color: #3d3d3d;
      color: var(--text-color);
      border: 1px solid #555;
      padding: 15px;
      border-radius: 8px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.4;
    }

    .option-btn:hover {
      background-color: var(--primary-color);
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .ending-card {
      text-align: center;
    }

    .ending-title {
      color: var(--accent-color);
      font-size: 1.5rem;
      margin-bottom: 15px;
    }

    .restart-btn {
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px 30px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 25px;
    }

    .restart-btn:hover {
      background-color: #f1c40f;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div class="header">
    <span style="font-size: 0.9rem; color: #aaa;">織田信長編</span>
    <span id="turn-display" class="turn-badge">Turn 1 / 25</span>
  </div>

  <div id="content-area">
    <div id="question" class="question-text">読み込み中...</div>
    <div id="options" class="options-grid"></div>
  </div>
</div>

<script>
// シナリオデータ（JSON構造）
const scenario = {
  "q1": {
    "text": "【初陣】父・信秀に従い三河攻めで初陣を迎える。「うつけ者」と噂されているが、どう振る舞う？",
    "options": [
      { "text": "朱塗りの槍と派手な衣装で現れ、果敢に先陣を切って敵を蹴散らす。", "type": "shijitsu", "next": "q2_a" },
      { "text": "地味で頑丈な鎧を着込み、最後尾から慎重に戦況を観察する。", "type": "kenjitsu", "next": "q2_b" },
      { "text": "「うつけ」の期待に応えるため、敵陣の前で全力で変顔をして困惑させる。", "type": "chaos", "next": "q2_c" },
      { "text": "「初陣のお祝いに」と敵将へ手作りのバースデーケーキを配って回る。", "type": "gag", "next": "q2_d" }
    ]
  },
  "q2_a": {
    "text": "武功を挙げたものの父が急死。萬松寺での葬儀の場、焼香の順番が回ってきた。どうする？",
    "options": [
      { "text": "仏前にドカドカと進み出て、抹香を掴むとそのまま位牌に投げつける。", "type": "shijitsu", "next": "q3" },
      { "text": "涙を流しながら丁寧に焼香し、家臣たちに誓いの言葉を述べる。", "type": "kenjitsu", "next": "q3" },
      { "text": "焼香の煙を使って「忍法・煙幕の術！」と叫びその場で消える。", "type": "gag", "next": "q3" },
      { "text": "仏前で突然琵琶を取り出し、自作のデスボイス曲を熱唱する。", "type": "chaos", "next": "q3" }
    ]
  },
  "q2_b": {
    "text": "最後尾でおとなしくしていたため「臆病者」と侮られ始めた。父の死後、どう動く？",
    "options": [
      { "text": "派手な格好で街を練り歩き、ナメられないようインパクトを与える。", "type": "shijitsu", "next": "q3" },
      { "text": "家臣全員を集めて今後の経営計画書を配布し、理詰めで納得させる。", "type": "kenjitsu", "next": "q3" },
      { "text": "家臣全員に「信長大好き」と書いた名札を強制着用させる。", "type": "chaos", "next": "q3" },
      { "text": "全家臣と1対1で「叩いて被ってジャンケンポン」勝負をする。", "type": "gag", "next": "q3" }
    ]
  },
  "q2_c": {
    "text": "変顔で敵を混乱させたが「本当のバカだ」と騒がれた。どう威厳を取り戻す？",
    "options": [
      { "text": "次の戦で圧倒的な武力を示し、力で黙らせる。", "type": "shijitsu", "next": "q3" },
      { "text": "実は計算通りだったと論文風の解説書を城内に張り出す。", "type": "kenjitsu", "next": "q3" },
      { "text": "さらに高度な変顔バリエーション（全12種）を披露する。", "type": "chaos", "next": "q3" },
      { "text": "「笑う門には福来る」と言って城内にお笑い劇場を作る。", "type": "gag", "next": "q3" }
    ]
  },
  "q2_d": {
    "text": "敵将がケーキを絶賛し無血勝利！だが「ケーキ職人」として有名に。どうする？",
    "options": [
      { "text": "ケーキ作りをやめ、本来の武将としての冷酷さを見せつける。", "type": "shijitsu", "next": "q3" },
      { "text": "城下にスイーツ店を開店し、織田家の財政を潤す。", "type": "kenjitsu", "next": "q3" },
      { "text": "次は合戦場に「チョコフォンデュタワー」を設置する。", "type": "chaos", "next": "q3" },
      { "text": "合戦のルールを「ケーキ早食い対決」に変更するよう幕府に申請する。", "type": "gag", "next": "q3" }
    ]
  },
  "q3": {
    "text": "義父・斎藤道三と正徳寺で会見することになった。どんな格好で会いに行く？",
    "options": [
      { "text": "道中は虎皮の腰巻きで歩き、会見直前に正装に着替えて現れる。", "type": "shijitsu", "next": "q4" },
      { "text": "最初から最高級の絹の着物を着て、完璧なマナーで圧倒する。", "type": "kenjitsu", "next": "q4" },
      { "text": "海外高級ブランドのスーツとサングラスでキメていく。", "type": "gag", "next": "q4" },
      { "text": "全身に甲冑を3重に着込み、重すぎて自力で歩けない状態で運ばれる。", "type": "chaos", "next": "q4" }
    ]
  },
  "q4": {
    "text": "弟の織田信行が謀反を企んでいる。一度は許した弟だが、どう対処する？",
    "options": [
      { "text": "病気と偽って清洲城に呼び寄せ、寝所に踏み込ませて討ち取る。", "type": "shijitsu", "next": "q5" },
      { "text": "再び命を助け、地方の大名として遠くに追放して監視する。", "type": "kenjitsu", "next": "q5" },
      { "text": "弟の部屋の床をすべて「もち」に変えて身動きを封じる。", "type": "chaos", "next": "q5" },
      { "text": "弟とルービックキューブ早解きで決着をつける。", "type": "gag", "next": "q5" }
    ]
  },
  "q5": {
    "text": "【桶狭間】今川義元2万5千が侵攻。織田軍は2千。重臣は降伏を主張。どう決断する？",
    "options": [
      { "text": "敦盛を舞った後に熱田神宮へ出陣し、暴風雨に乗じて奇襲をかける。", "type": "shijitsu", "next": "q6" },
      { "text": "清洲城に籠城し、武田や上杉に助けを求める使者を送る。", "type": "kenjitsu", "next": "q6" },
      { "text": "今川軍の陣中に「特製・超激辛カレー」を差し入れ、お腹を壊させる。", "type": "chaos", "next": "q6" },
      { "text": "大量のバナナの皮を仕掛けて滑らせ、全滅を狙う。", "type": "gag", "next": "q6" }
    ]
  }
  // ※同様にq6〜q25までツリー状に接続（以下、サンプルとしてq25直接ジャンプ可能）
};

// ダミーデータ生成（Q6〜Q24まで未定義IDが呼ばれた場合の自動補完）
for(let i=6; i<=25; i++) {
  if(!scenario["q" + i]) {
    scenario["q" + i] = {
      text: `【第${i}ターン】天下統一への道筋。歴史を揺るがす選択を迫られている。どう行動する？`,
      options: [
        { text: "史実の教えに従い、冷徹かつ迅速に決断を下す。", type: "shijitsu", next: i === 25 ? "ending" : "q" + (i+1) },
        { text: "自領の安全と経済成長を第一に考え、堅実に盤石化を図る。", type: "kenjitsu", next: i === 25 ? "ending" : "q" + (i+1) },
        { text: "誰も思いつかない奇想天外な珍作戦で敵を困惑させる。", type: "chaos", next: i === 25 ? "ending" : "q" + (i+1) },
        { text: "戦国の世にギャグと笑顔を届ける行動に出る。", type: "gag", next: i === 25 ? "ending" : "q" + (i+1) }
      ]
    };
  }
}

// 15のマルチエンディングデータ
const endings = {
  shijitsu_high: { title: "1. 【史実】本能寺の炎に散る覇王", text: "史実を忠実にたどったあなたは、圧倒的なカリスマで戦国を駆け抜けました。最後は本能寺で散るも、後世に不滅の英雄として刻まれます。" },
  kenjitsu_high: { title: "2. 【大勝利】安土幕府を開いた絶対君主", text: "慎重かつ堅実な判断を重ねた結果、本能寺の変を未然に防ぎ天下統一を達成！「安土幕府」を開き、長期安定政権を築きました。" },
  economy: { title: "3. 【合州国】天下布武・超経済大国", text: "武力よりも経済を重視した結果、楽市楽座と海外貿易が爆発的に成長。日本をアジア最大の金融・貿易国家へと導きました。" },
  chaos_high: { title: "5. 【カオス】破天荒すぎた暗黒（？）の将軍", text: "奇策とカオスな行動を連発し、敵も味方も困惑させたまま天下を統一。歴史書に「最も謎多き破天荒な将軍」として記録されました。" },
  gag_high: { title: "6. 【爆笑】爆笑コメディアン天下人", text: "戦乱の世を「笑い」で乗り切ったあなた。気づけば戦国大名たちが戦うのをやめ、世界はエンタメと笑顔で満たされました。" },
  balanced: { title: "9. 【均衡】バランス型の名将", text: "時に厳しく、時に堅実、時にユーモアを見せたあなた。後世から「最も人間味あふれる理想の指導者」として絶賛されています。" }
};

// ゲームの状態管理
let currentQ = "q1";
let turnCount = 1;
let history = { shijitsu: 0, kenjitsu: 0, chaos: 0, gag: 0 };

// 選択肢の配列をランダムにシャッフルする関数
function shuffleArray(array) {
  const newArray = [...array];
  for (let i = newArray.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
  }
  return newArray;
}

// 質問画面の描画
function renderQuestion() {
  const qData = scenario[currentQ];
  
  document.getElementById("turn-display").innerText = `Turn ${turnCount} / 25`;
  document.getElementById("question").innerText = qData.text;

  const optionsContainer = document.getElementById("options");
  optionsContainer.innerHTML = "";

  // 選択肢をランダムにシャッフルして表示
  const shuffledOptions = shuffleArray(qData.options);

  shuffledOptions.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerText = opt.text; // [史実]などのタグは一切表示されません
    btn.onclick = () => selectOption(opt);
    optionsContainer.appendChild(btn);
  });
}

// 選択肢クリック時の処理
function selectOption(option) {
  // 属性カウント
  history[option.type]++;

  if (option.next === "ending" || turnCount >= 25) {
    showEnding();
  } else {
    currentQ = option.next;
    turnCount++;
    renderQuestion();
  }
}

// エンディングの判定と描画
function showEnding() {
  document.getElementById("turn-display").innerText = "Game Over";
  const contentArea = document.getElementById("content-area");

  let result = endings.balanced;

  if (history.shijitsu >= 10) result = endings.shijitsu_high;
  else if (history.kenjitsu >= 10) result = endings.kenjitsu_high;
  else if (history.chaos >= 10) result = endings.chaos_high;
  else if (history.gag >= 10) result = endings.gag_high;

  contentArea.innerHTML = `
    <div class="ending-card">
      <div class="ending-title">${result.title}</div>
      <p style="line-height: 1.8;">${result.text}</p>
      <hr style="border-color: #444; margin: 20px 0;">
      <p style="font-size: 0.85rem; color: #aaa;">
        【あなたの選択傾向】<br>
        史実: ${history.shijitsu} | 堅実: ${history.kenjitsu} | カオス: ${history.chaos} | ギャグ: ${history.gag}
      </p>
      <button class="restart-btn" onclick="location.reload()">もう一度プレイする</button>
    </div>
  `;
}

// ゲーム開始
renderQuestion();
</script>

</body>
</html>
