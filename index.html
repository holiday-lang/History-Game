<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>なりきり歴史シミュレーション：織田信長編</title>
  <style>
    :root {
      --primary-color: #8b0000;
      --bg-color: #1a1a1a;
      --card-bg: #2d2d2d;
      --text-color: #f0f0f0;
      --accent-color: #d4af37;
    }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    #game-container {
      background-color: var(--card-bg);
      border: 2px solid var(--accent-color);
      border-radius: 12px;
      max-width: 650px;
      width: 100%;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #444;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .turn-badge {
      background-color: var(--primary-color);
      color: #fff;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .question-text {
      font-size: 1.15rem;
      line-height: 1.6;
      margin-bottom: 25px;
      white-space: pre-wrap;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background-color: #3d3d3d;
      color: var(--text-color);
      border: 1px solid #555;
      padding: 15px;
      border-radius: 8px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.4;
    }

    .option-btn:hover {
      background-color: var(--primary-color);
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .ending-card {
      text-align: center;
    }

    .ending-title {
      color: var(--accent-color);
      font-size: 1.5rem;
      margin-bottom: 15px;
    }

    .restart-btn {
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px 30px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 25px;
    }

    .restart-btn:hover {
      background-color: #f1c40f;
    }
  </style>
</head>

    <div id="options" class="options-grid"></div>

      { "text": "「鳴かぬなら 殺してしまえ ホトトギス」— 我が道を取り壊し新時代を開け！", "type": "shijitsu" },

// 15のマルチエンディングデータ
const endings = {
  e1: { title: "1. 【史実】本能寺の炎に散る覇王", text: "史実を忠実にたどったあなたは、圧倒的なカリスマで戦国を駆け抜けました。最後は本能寺で散るも、後世に不滅の英雄として刻まれます。" },
  e2: { title: "2. 【大勝利】安土幕府を開いた絶対君主", text: "慎重かつ堅実な判断を重ねた結果、本能寺の変を未然に防ぎ天下統一を達成！「安土幕府」を開き、長期安定政権を築きました。" },
  e3: { title: "3. 【合州国】天下布武・超経済大国", text: "武力よりも経済を重視した結果、楽市楽座と海外貿易が爆発的に成長。日本をアジア最大の金融・貿易国家へと導きました。" },
  e5: { title: "5. 【カオス】破天荒すぎた暗黒（？）の将軍", text: "奇策とカオスな行動を連発し、敵も味方も困惑させたまま天下を統一。歴史書に「最も謎多き破天荒な将軍」として記録されました。" },
  e6: { title: "6. 【爆笑】爆笑コメディアン天下人", text: "戦乱の世を「笑い」で乗り切ったあなた。気づけば戦国大名たちが戦うのをやめ、世界はエンタメと笑顔で満たされました。" },
  e9: { title: "9. 【均衡】バランス型の名将", text: "時に厳しく、時に堅実、時にユーモアを見せたあなた。後世から「最も人間味あふれる理想の指導者」として絶賛されています。" }
};

// ゲーム状態管理
let currentTurn = 1;
let history = { shijitsu: 0, kenjitsu: 0, chaos: 0, gag: 0 };

// 配列シャッフル関数
function shuffleArray(array) {
  const newArray = [...array];
  for (let i = newArray.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
  }
  return newArray;
}

// 描画処理
function renderQuestion() {
  const qData = scenario["q" + currentTurn];
  
  document.getElementById("turn-display").innerText = `Turn ${currentTurn} / 25`;
  document.getElementById("question").innerText = qData.text;

  const optionsContainer = document.getElementById("options");
  optionsContainer.innerHTML = "";

  // 毎回選択肢をシャッフル
  const shuffledOptions = shuffleArray(qData.options);

  shuffledOptions.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerText = opt.text;
    btn.onclick = () => selectOption(opt.type);
    optionsContainer.appendChild(btn);
  });
}

// 選択処理
function selectOption(type) {
  history[type]++;

  if (currentTurn >= 25) {
    showEnding();
  } else {
    currentTurn++;
    renderQuestion();
  }
}

// エンディング処理
function showEnding() {
  document.getElementById("turn-display").innerText = "Game Over";
  const contentArea = document.getElementById("content-area");

  let result = endings.e9;

  if (history.shijitsu >= 10) result = endings.e1;
  else if (history.kenjitsu >= 10) result = endings.e2;
  else if (history.chaos >= 10) result = endings.e5;
  else if (history.gag >= 10) result = endings.e6;

  contentArea.innerHTML = `
    <div class="ending-card">
      <div class="ending-title">${result.title}</div>
      <p style="line-height: 1.8;">${result.text}</p>
      <hr style="border-color: #444; margin: 20px 0;">
      <p style="font-size: 0.85rem; color: #aaa;">
        【あなたの選択傾向】<br>
        史実: ${history.shijitsu} | 堅実: ${history.kenjitsu} | カオス: ${history.chaos} | ギャグ: ${history.gag}
      </p>
      <button class="restart-btn" onclick="location.reload()">もう一度プレイする</button>
    </div>
  `;
}

// 初回呼び出し
renderQuestion();
</script>
