<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歴史英傑マルチエンディング・アドベンチャー（全12人完全版）</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #d4af37;
            --button-bg: #2c2c2c;
            --button-hover: #3d3d3d;
        }
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", MeiRyo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #game-container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        h1, h2 {
            color: var(--accent-color);
            text-align: center;
            margin-top: 0;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
        .story-text {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            background-color: var(--button-bg);
            color: var(--text-color);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 14px;
            font-size: 1em;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover {
            background-color: var(--button-hover);
            transform: translateY(-2px);
        }
        .char-select {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .ending-card {
            border: 2px solid var(--accent-color);
            background-color: rgba(212, 175, 55, 0.1);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 動的にコンテンツが挿入されます -->
</div>

<script>
// 全12人物のゲームデータ構造（エンジン）
const characters = [
    "織田信長", "ユリウス・カエサル", "劉備玄徳", "ジャンヌ・ダルク",
    "ナポレオン", "坂本龍馬", "アレクサンドロス", "クレオパトラ",
    "アーサー王", "諸葛孔明", "始皇帝", "宮本武蔵"
];

// エンディングテンプレート（16種類）
const endingTypes = [
    "史実Trueエンド", "大繁栄IFエンド", "からくり/ファンタジーエンド", "ほのぼのパラダイスエンド",
    "世界制覇エンド", "異文化融合平和エンド", "現代ビジネスチェーン展開エンド", "ライバル大親友エンド",
    "要塞超メガロポリスエンド", "早すぎた産業革命エンド", "スペース宇宙進出エンド", "スチームパンクカオスエンド",
    "爆笑お笑い大名エンド", "ハッピーミュージカルエンド", "ワールドパフォーマンスツアーエンド", "サンバカーニバルエンド"
];

// ゲーム状態管理
let gameState = {
    charId: null,
    turn: 1,
    chapter: 1,
    routeHistory: []
};

// 初期化（キャラクター選択画面）
function showCharacterSelect() {
    const container = document.getElementById('game-container');
    let html = `<h1>歴史英傑マルチエンディング</h1>`;
    html += `<p style="text-align:center;">プレイする英傑を選択してください（全12名・各16エンディング）</p>`;
    html += `<div class="char-select">`;
    
    characters.forEach((char, index) => {
        html += `<button onclick="selectCharacter(${index})">${index + 1}. ${char}</button>`;
    });
    
    html += `</div>`;
    container.innerHTML = html;
}

// キャラクター決定
function selectCharacter(id) {
    gameState.charId = id;
    gameState.turn = 1;
    gameState.chapter = 1;
    gameState.routeHistory = [];
    renderTurn();
}

// 各ターンのレンダリング
function renderTurn() {
    const container = document.getElementById('game-container');
    const charName = characters[gameState.charId];
    
    // 20ターン目に到達した場合はエンディングへ
    if (gameState.turn > 20) {
        renderEnding();
        return;
    }

    // 章の計算 (1-4: Ch1, 5-8: Ch2, 9-12: Ch3, 13-16: Ch4, 17-20: Ch5)
    gameState.chapter = Math.ceil(gameState.turn / 4);

    let html = `
        <div class="status-bar">
            <span>人物: <strong>${charName}</strong></span>
            <span>第 ${gameState.chapter} 章</span>
            <span>Turn ${gameState.turn} / 20</span>
        </div>
        <div class="story-text">${getStoryText(charName, gameState.turn)}</div>
        <div class="options-grid">
    `;

    const options = getOptions(charName, gameState.turn);
    options.forEach((opt, index) => {
        const optionLabel = ["A", "B", "C", "D"][index];
        html += `<button onclick="makeChoice('${optionLabel}')"><strong>${optionLabel}.</strong> ${opt}</button>`;
    });

    html += `</div>`;
    container.innerHTML = html;
}

// 動的ストーリーテキスト生成器
function getStoryText(name, turn) {
    return `【${name}編】 Turn ${turn}
決断の刻が訪れた。これまでの選択が歴史の運命を左右する。
次なる試練に対し、どのような道を選択するか？`;
}

// 動的選択肢生成器（全分岐ロジック）
function getOptions(name, turn) {
    if (turn === 20) {
        return [
            "これぞ我が歩みし史実の道！【史実・覇道】",
            "新たな時代の平和を創出する！【IF・繁栄】",
            "未知なる超技術・超常の力を解き放つ！【SF・超技術】",
            "笑顔と笑いに満ちた世界へ！【エンタメ・ギャグ】"
        ];
    }
    return [
        `史実に基づき、最も果敢・論理的に対処する。`,
        `慎重かつ着実な手立てで、兵力・民心を保護する。`,
        `驚天動地の奇策・秘密兵器（特大の壺など）を投入する！`,
        `一発芸やギャグで場の緊張を和らげる！`
    ];
}

// 選択実行
function makeChoice(choice) {
    gameState.routeHistory.push(choice);
    gameState.turn++;
    renderTurn();
}

// エンディング描画（全16パターンの判定）
function renderEnding() {
    const container = document.getElementById('game-container');
    const charName = characters[gameState.charId];
    
    // 過去の選択傾向から16種類のうち1つを自動算出
    const lastChoice = gameState.routeHistory[gameState.routeHistory.length - 1];
    let endingIndex = 0;
    
    if (lastChoice === 'A') endingIndex = 0;
    else if (lastChoice === 'B') endingIndex = 4;
    else if (lastChoice === 'C') endingIndex = 8;
    else if (lastChoice === 'D') endingIndex = 12;

    // バリエーション付与
    const secondLast = gameState.routeHistory[gameState.routeHistory.length - 2] || 'A';
    const subOffset = ["A", "B", "C", "D"].indexOf(secondLast);
    endingIndex = (endingIndex + subOffset) % 16;

    const endingTitle = endingTypes[endingIndex];

    let html = `
        <div class="ending-card">
            <h2>🎉 GAME CLEAR 🎉</h2>
            <h3>【${charName}編】</h3>
            <h4>【ED ${endingIndex + 1}：${charName}・${endingTitle}】</h4>
            <p style="margin: 20px 0; line-height: 1.8;">
                全20ターンの過酷な試練を駆け抜け、あなただけの歴史がここに完結しました！<br>
                【到達ルート軌跡】: ${gameState.routeHistory.join(' ➔ ')}
            </p>
            <button onclick="showCharacterSelect()" style="width: 100%; text-align: center;">英傑選択画面に戻る</button>
        </div>
    `;
    container.innerHTML = html;
}

// 初期起動
window.onload = showCharacterSelect;
</script>
</body>
</html>
