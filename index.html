<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歴史英雄マルチエンディング・ノベルゲーム</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        #game-container {
            width: 100%;
            max-width: 800px;
            background-color: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            padding: 30px;
            border: 1px solid #333;
        }
        h1, h2, h3 {
            color: #ffffff;
            margin-bottom: 20px;
            text-align: center;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        
        /* ローディング画面 */
        #loading-screen {
            text-align: center;
            padding: 40px 0;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #4facfe;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* キャラクター選択画面 */
        .char-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .char-card {
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .char-card:hover {
            border-color: #4facfe;
            transform: translateY(-3px);
            background: #333;
        }
        .char-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }
        .char-theme {
            font-size: 0.85rem;
            color: #aaa;
        }

        /* ゲーム画面 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            background: #2a2a2a;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #bbb;
        }
        .story-box {
            background: #262626;
            border-left: 4px solid #4facfe;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 25px;
            font-size: 1.05rem;
            line-height: 1.6;
            min-height: 120px;
        }
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-choice {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 14px 20px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            transition: all 0.2s;
            line-height: 1.4;
        }
        .btn-choice:hover {
            background: #3a3a3a;
            border-color: #00f2fe;
            padding-left: 25px;
        }

        /* エンディング画面 */
        .ending-box {
            background: #2a2a2a;
            border: 2px solid #ffd700;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 25px;
        }
        .ending-title {
            color: #ffd700;
            font-size: 1.4rem;
            margin-bottom: 15px;
        }
        .ending-desc {
            font-size: 1rem;
            line-height: 1.6;
            color: #ddd;
        }
        .btn-reset {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #121212;
            font-weight: bold;
            border: none;
            padding: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            text-align: center;
            transition: opacity 0.2s;
        }
        .btn-reset:hover {
            opacity: 0.9;
        }
        
        .error-message {
            color: #ff5555;
            text-align: center;
            padding: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 0. ローディング画面 -->
    <div id="loading-screen" class="screen active">
        <div class="spinner"></div>
        <h2>ゲームデータを読み込んでいます...</h2>
        <p id="loading-text" style="color: #888; margin-top: 10px;">game_data.json を取得中</p>
    </div>

    <!-- 1. キャラクター選択画面 -->
    <div id="select-screen" class="screen">
        <h1 id="game-title">歴史英雄マルチエンディング</h1>
        <p style="text-align: center; color: #aaa; margin-bottom: 20px;">プレイする英傑を選択してください</p>
        <div id="char-grid" class="char-grid"></div>
    </div>

    <!-- 2. ゲームプレイ画面 -->
    <div id="play-screen" class="screen">
        <div class="status-bar">
            <span id="status-char">英雄名</span>
            <span id="status-chapter">第1章</span>
            <span id="status-turn">Turn 1 / 20</span>
        </div>
        <h3 id="chapter-title" style="color: #4facfe; font-size: 1.1rem; text-align: left;">章タイトル</h3>
        <div id="story-text" class="story-box">シナリオ文章がここに表示されます。</div>
        <div id="choices-container" class="choices-container"></div>
    </div>

    <!-- 3. エンディング画面 -->
    <div id="ending-screen" class="screen">
        <h2>GAME CLEAR</h2>
        <div class="ending-box">
            <div id="ending-title" class="ending-title">エンディングタイトル</div>
            <div id="ending-desc" class="ending-desc">エンディングの詳細文章がここに表示されます。</div>
        </div>
        <button class="btn-reset" onclick="resetGame()">タイトル画面に戻る</button>
    </div>
</div>

<script>
    // ゲームの状態管理
    let gameData = null;
    let currentCharacter = null;
    let currentTurnIndex = 0;
    let userHistory = []; // 選択履歴（例: ["A", "B", "A", "C"]）

    // DOM要素の取得
    const screens = {
        loading: document.getElementById('loading-screen'),
        select: document.getElementById('select-screen'),
        play: document.getElementById('play-screen'),
        ending: document.getElementById('ending-screen')
    };

    // 画面切り替え関数
    function showScreen(screenName) {
        Object.keys(screens).forEach(key => {
            screens[key].classList.remove('active');
        });
        screens[screenName].classList.add('active');
    }

    // 1. game_data.json の読み込み (fetch)
    window.addEventListener('DOMContentLoaded', () => {
        fetch('game_data.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTPエラー! ステータス: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                gameData = data;
                initCharacterSelect();
            })
            .catch(error => {
                console.error('game_data.json の読み込み失敗:', error);
                document.getElementById('loading-screen').innerHTML = `
                    <div class="error-message">
                        <h3>データの読み込みに失敗しました</h3>
                        <p>game_data.json が同じディレクトリにあるか確認してください。</p>
                        <p style="font-size: 0.8rem; color: #888; margin-top: 10px;">${error.message}</p>
                    </div>
                `;
            });
    });

    // 2. キャラクター選択画面の初期化
    function initCharacterSelect() {
        if (gameData.title) {
            document.getElementById('game-title').innerText = gameData.title;
        }
        
        const charGrid = document.getElementById('char-grid');
        charGrid.innerHTML = '';

        gameData.characters.forEach(char => {
            const card = document.createElement('div');
            card.className = 'char-card';
            card.onclick = () => startGame(char.id);
            card.innerHTML = `
                <div class="char-name">${char.name}</div>
                <div class="char-theme">${char.theme}</div>
            `;
            charGrid.appendChild(card);
        });

        showScreen('select');
    }

    // 3. ゲーム開始
    function startGame(charId) {
        currentCharacter = gameData.characters.find(c => c.id === charId);
        currentTurnIndex = 0;
        userHistory = [];
        renderTurn();
        showScreen('play');
    }

    // 4. ターン（シナリオ・選択肢）の描画
    function renderTurn() {
        const turnData = currentCharacter.turns[currentTurnIndex];

        // ステータス更新
        document.getElementById('status-char').innerText = currentCharacter.name;
        document.getElementById('status-chapter').innerText = `第${turnData.chapter}章`;
        document.getElementById('status-turn').innerText = `Turn ${turnData.turn} / 20`;
        document.getElementById('chapter-title').innerText = turnData.chapter_title;
        document.getElementById('story-text').innerText = turnData.text;

        // 選択肢ボタンの生成
        const choicesContainer = document.getElementById('choices-container');
        choicesContainer.innerHTML = '';

        turnData.choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'btn-choice';
            btn.innerText = choice.text;
            btn.onclick = () => makeChoice(choice.branch);
            choicesContainer.appendChild(btn);
        });
    }

    // 5. 選択肢が選ばれたときの処理
    function makeChoice(branch) {
        userHistory.push(branch);

        if (currentTurnIndex < currentCharacter.turns.length - 1) {
            currentTurnIndex++;
            renderTurn();
        } else {
            showEnding();
        }
    }

    // 6. エンディング描画処理
    function showEnding() {
        // 各章（5ターンごと）で最も多く選ばれた選択肢を計算して分岐キーを作る
        const getDominantBranch = (choices) => {
            const counts = {};
            choices.forEach(c => counts[c] = (counts[c] || 0) + 1);
            return Object.keys(counts).reduce((a, b) => counts[a] >= counts[b] ? a : b, 'A');
        };

        const b1 = getDominantBranch(userHistory.slice(0, 5));
        const b2 = getDominantBranch(userHistory.slice(5, 10));
        const b3 = getDominantBranch(userHistory.slice(10, 15));
        const b4 = getDominantBranch(userHistory.slice(15, 20));

        const endingKey = `${b1}_${b2}_${b3}_${b4}`;
        
        // エンディングデータの参照（一致するキーがなければデフォルトにフォールバック）
        let ending = currentCharacter.endings[endingKey];
        if (!ending) {
            const fallbackKey = `${b1}_${b2}_A_A`;
            ending = currentCharacter.endings[fallbackKey] || Object.values(currentCharacter.endings)[0];
        }

        document.getElementById('ending-title').innerText = ending.title;
        document.getElementById('ending-desc').innerText = ending.description;

        showScreen('ending');
    }

    // 7. タイトルへ戻る
    function resetGame() {
        showScreen('select');
    }
</script>

</body>
</html>
